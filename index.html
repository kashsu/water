<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroTrack - Daily Water Tracker</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-light: #38bdf8;
            --primary-bg: #e0f2fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Water Bottle Gauge */
        .gauge-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .bottle-wrapper {
            position: relative;
            width: 140px;
            height: 240px;
            border: 4px solid var(--primary);
            border-radius: 20px 20px 30px 30px;
            overflow: hidden;
            background: #f1f5f9;
        }

        .water-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--primary-light), var(--primary));
            transition: height 0.6s ease-in-out;
        }

        .bottle-stats {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            font-weight: bold;
            text-shadow: 0 0 4px rgba(255,255,255,0.8);
        }

        .percentage {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        .current-amount {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Quick Add Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-quick {
            background: var(--primary-bg);
            color: var(--primary);
            border: 1px solid var(--primary-light);
            border-radius: 12px;
            padding: 12px 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-quick:hover {
            background: var(--primary);
            color: white;
        }

        .custom-input-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Goal & Reset Row */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .btn-text {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* History Log */
        .log-list {
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>💧 HydroTrack</h1>
    </header>

    <!-- Visual Progress Card -->
    <div class="card gauge-section">
        <div class="bottle-wrapper">
            <div class="water-fill" id="waterFill"></div>
            <div class="bottle-stats">
                <div class="percentage" id="percentText">0%</div>
                <div class="current-amount" id="amountText">0 / 2500 ml</div>
            </div>
        </div>
    </div>

    <!-- Controls Card -->
    <div class="card">
        <div class="controls-grid">
            <button class="btn-quick" onclick="addWater(250)">
                <span>🥛 Glass</span>
                <span>+250 ml</span>
            </button>
            <button class="btn-quick" onclick="addWater(500)">
                <span>🍾 Bottle</span>
                <span>+500 ml</span>
            </button>
            <button class="btn-quick" onclick="addWater(750)">
                <span>🏺 Flask</span>
                <span>+750 ml</span>
            </button>
        </div>

        <div class="custom-input-group">
            <input type="number" id="customInput" placeholder="Custom amount (ml)" min="1">
            <button class="btn-primary" onclick="addCustomWater()">Add</button>
        </div>
    </div>

    <!-- Settings & Log Card -->
    <div class="card">
        <div class="settings-row">
            <div>
                <strong>Daily Goal:</strong> 
                <span id="goalText">2500 ml</span>
                <button class="btn-text" style="color:var(--primary); margin-left:6px;" onclick="editGoal()">Edit</button>
            </div>
            <button class="btn-text" onclick="resetDay()">Reset Day</button>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border); margin: 12px 0;">

        <div style="font-weight: 600; font-size: 0.9rem; margin-bottom: 6px;">Today's Log</div>
        <ul class="log-list" id="logList"></ul>
    </div>
</div>

<script>
    let currentIntake = 0;
    let dailyGoal = 2500;
    let logs = [];

    // Load saved data on startup
    window.onload = function() {
        const savedData = localStorage.getItem('hydrotrack_data');
        if (savedData) {
            const parsed = JSON.parse(savedData);
            currentIntake = parsed.currentIntake || 0;
            dailyGoal = parsed.dailyGoal || 2500;
            logs = parsed.logs || [];
        }
        updateUI();
    };

    function saveData() {
        localStorage.setItem('hydrotrack_data', JSON.stringify({
            currentIntake,
            dailyGoal,
            logs
        }));
    }

    function addWater(amount) {
        currentIntake += amount;
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        logs.unshift({ amount, time: timeStr });
        saveData();
        updateUI();
    }

    function addCustomWater() {
        const input = document.getElementById('customInput');
        const val = parseInt(input.value);
        if (val && val > 0) {
            addWater(val);
            input.value = '';
        }
    }

    function editGoal() {
        const newGoal = prompt('Enter your new daily goal in ml:', dailyGoal);
        if (newGoal && !isNaN(newGoal) && newGoal > 0) {
            dailyGoal = parseInt(newGoal);
            saveData();
            updateUI();
        }
    }

    function resetDay() {
        if (confirm('Are you sure you want to clear today\'s intake history?')) {
            currentIntake = 0;
            logs = [];
            saveData();
            updateUI();
        }
    }

    function updateUI() {
        // Percentage calculation
        const percent = Math.min(Math.round((currentIntake / dailyGoal) * 100), 100);
        
        // Update Fill and Text
        document.getElementById('waterFill').style.height = `${percent}%`;
        document.getElementById('percentText').innerText = `${percent}%`;
        document.getElementById('amountText').innerText = `${currentIntake} / ${dailyGoal} ml`;
        document.getElementById('goalText').innerText = `${dailyGoal} ml`;

        // Render Log List
        const listEl = document.getElementById('logList');
        listEl.innerHTML = '';
        
        if (logs.length === 0) {
            listEl.innerHTML = '<li class="log-item" style="color:var(--text-muted);">No entries yet today.</li>';
        } else {
            logs.forEach(item => {
                const li = document.createElement('li');
                li.className = 'log-item';
                li.innerHTML = `<span>+${item.amount} ml</span><span>${item.time}</span>`;
                listEl.appendChild(li);
            });
        }
    }
</script>

</body>
</html>
